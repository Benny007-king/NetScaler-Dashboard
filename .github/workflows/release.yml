name: Release

# Pushing a version tag builds the two things people download, tests them by
# booting the appliance, and attaches them to a GitHub Release:
#
#   netscaler-dashboard-appliance-<version>.ova   first-time install
#   netscaler-dashboard-upgrade-<version>.nsu     upgrade (uploaded in Settings)
#
# "Run workflow" does the same build and test without publishing; the files are
# kept as a workflow artifact for a few days instead.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appliance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v$(tr -d ' \t\r\n' < VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION)). The artefacts are named after VERSION."
            exit 1
          fi

      - name: Allow the test VM to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Unit tests (login, certificates, LDAP group rule, storage, upgrade agent)
        run: |
          docker build -q --build-arg APP_VERSION="$(cat VERSION)" -t nsd-ci-test . >/dev/null
          for t in test_auth test_certs test_ldap_group test_storage; do
            docker run --rm -v "$PWD:/app:ro" -w /tmp nsd-ci-test python "/app/tests/$t.py"
          done
          docker run --rm -v "$PWD:/src:ro" debian:13 bash /src/appliance/test-upgrade-agent.sh

      - name: Build the appliance (OVA) and the upgrade bundle (.nsu)
        run: bash appliance/build.sh

      - name: Boot the appliance and test install, upgrade, external database, rollback and the console menu
        run: bash appliance/smoke-test.sh

      # The upgrade file is the only way an installed appliance gets this release,
      # so prove it on the release people are actually running.
      - name: Upgrade the previous release to this one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \t\r\n' < VERSION)
          # The newest release OLDER than this version (not simply the latest one:
          # a maintenance release for an older line must not try to "upgrade" a
          # newer appliance). A failing listing fails the step - it must never
          # look like "there is no earlier release".
          tags=$(gh release list --limit 200 --exclude-drafts --exclude-pre-releases --json tagName -q '.[].tagName')
          prev=$(printf '%s\n' $tags "v$v" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -u \
                 | awk -v me="v$v" '$0 == me { print last; exit } { last = $0 }')
          if [ -z "$prev" ]; then
            echo "::notice::No release older than v$v exists - nothing to upgrade from."
            exit 0
          fi
          mkdir -p previous
          gh release download "$prev" --pattern 'netscaler-dashboard-appliance-*.ova' --dir previous
          ova=$(ls previous/*.ova 2>/dev/null | head -n 1)
          [ -n "$ova" ] || { echo "::error::Release $prev has no appliance (.ova) to upgrade from."; exit 1; }
          echo "Upgrading $prev to v$v"
          FROM_OVA=$ova bash appliance/smoke-test.sh

      - name: Write the release notes
        run: |
          v=$(tr -d ' \t\r\n' < VERSION)
          {
            awk -v v="$v" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md
            echo
            echo "---"
            echo "**First-time install:** download \`netscaler-dashboard-appliance-$v.ova\` and import it into VMware (ESXi, Workstation, Fusion) or VirtualBox."
            echo
            echo "**Upgrading an appliance:** download \`netscaler-dashboard-upgrade-$v.nsu\` and upload it in **Settings → Software & Upgrade**."
            echo
            echo "Checksums are in \`SHA256SUMS\`. Guide: https://net-scaler-dashboard-web.vercel.app/docs.html"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the GitHub Release
        # only when a tag is pushed - "Run workflow" never publishes, even on a tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.ova dist/*.nsu dist/SHA256SUMS \
            --title "NetScaler Dashboard $(tr -d ' \t\r\n' < VERSION)" \
            --notes-file release-notes.md

      - name: Keep the files from a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: netscaler-dashboard-artefacts
          path: |
            dist/*.ova
            dist/*.nsu
            dist/SHA256SUMS
          retention-days: 5
          compression-level: 0
